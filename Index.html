<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#090713;color:#fff;min-height:100vh}
.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 15%,#352052 0,#120d20 42%,#07060d 100%);z-index:-2}
.glow{position:fixed;width:280px;height:280px;border-radius:50%;background:#ff2f92;filter:blur(110px);opacity:.18;top:-80px;left:-70px;z-index:-1}
.glow2{position:fixed;width:250px;height:250px;border-radius:50%;background:#28a7ff;filter:blur(110px);opacity:.15;bottom:-80px;right:-50px;z-index:-1}
.wrap{max-width:520px;margin:auto;padding:20px 16px 40px}.card{background:rgba(20,16,33,.78);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:22px;box-shadow:0 18px 60px rgba(0,0,0,.45);backdrop-filter:blur(10px)}
.hidden{display:none}.center{text-align:center}h1{font-size:32px;margin:8px 0}h2{font-size:24px;margin:8px 0 12px}p{color:#d7d2df;line-height:1.55}
.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:rgba(255,72,156,.14);border:1px solid rgba(255,72,156,.35);font-size:13px}
.avatar{width:110px;height:110px;border-radius:24px;object-fit:cover;border:3px solid rgba(255,255,255,.25);margin:8px auto 12px;display:block}
.btn{width:100%;border:0;border-radius:16px;padding:14px 16px;margin-top:11px;background:linear-gradient(135deg,#ff3f9b,#8f5cff);color:#fff;font-size:16px;font-weight:750;cursor:pointer;box-shadow:0 10px 25px rgba(143,92,255,.2)}
.progress{height:7px;background:#211b2c;border-radius:10px;overflow:hidden;margin:4px 0 18px}.bar{height:100%;width:25%;background:linear-gradient(90deg,#ff3f9b,#8f5cff);transition:.35s}
.choice{text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:14px;border-radius:15px;margin-top:10px;cursor:pointer}
.heart{font-size:52px;animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.12)}}
.small{font-size:13px;color:#aaa3b6}.reveal{font-size:19px;color:#fff;line-height:1.65}
</style>

<script>
let level=0;
const levels=[
{title:"LEVEL 1 — DROP ZONE 🪂",text:"A squadmate needs one thing before landing. What should a good friend bring?",choices:["A) Only loot 😎","B) Backup + good vibes ❤️","C) Run away first 😂"],correct:1},
{title:"LEVEL 2 — BOOYAH TEST 🔥",text:"You and your friend are in a tough match. What matters most?",choices:["A) Blaming each other","B) Leaving the squad","C) Having fun and covering each other"],correct:2},
{title:"LEVEL 3 — SECRET CHEST 🎁",text:"You found a locked chest. Pick the key that unlocks this surprise.",choices:["🔑 Friendship","🔑 Diamonds","🔑 Luck"],correct:0},
{title:"FINAL LEVEL — ONE LAST QUESTION 💜",text:"After all the matches, what makes a friendship special?",choices:["Winning every game","Being there, even in random moments","Having the rarest skin"],correct:1}
];
function begin(){document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render();}
function render(){const l=levels[level];document.getElementById('bar').style.width=((level+1)/levels.length*100)+'%';document.getElementById('content').innerHTML=`<span class="badge">MISSION ${level+1}/4</span><h2>${l.title}</h2><p>${l.text}</p>`+l.choices.map((x,i)=>`<div class="choice" onclick="answer(${i})">${x}</div>`).join('');}
function answer(i){const l=levels[level];if(i!==l.correct){document.getElementById('content').innerHTML=`<div class="center"><div class="heart">😄</div><h2>Almost!</h2><p>Wrong answer… but this mission has unlimited retries.</p><button class="btn" onclick="render()">TRY AGAIN</button></div>`;return;}level++;if(level<levels.length){document.getElementById('content').innerHTML=`<div class="center"><div class="heart">💜</div><h2>Unlocked!</h2><p>Nice one! The next mission is waiting…</p><button class="btn" onclick="render()">NEXT LEVEL →</button></div>`;}else reveal();}
function reveal(){document.getElementById('bar').style.width='100%';document.getElementById('content').innerHTML=`<div class="center"><div class="heart">🎁</div><span class="badge">SURPRISE UNLOCKED</span><h1>Happy Birthday, Aruhi! 🎂💜</h1><p class="reveal">No diamonds. No expensive gift.<br><br>Just a little birthday surprise to make you smile today. 🎂✨<br><br><b>Wishing you lots of happiness, good memories and amazing moments ahead.</b><br><br>And yes… <b>next match mein Booyah together. 😎🔥</b></p><button class="btn" onclick="celebrate()">CLAIM YOUR BIRTHDAY GIFT 🎁</button><p id="done" class="small"></p></div>`;}
function celebrate(){document.getElementById('done').innerHTML="🎉 🎂 Birthday gift unlocked! Screenshot this screen and send it back 😄💜";for(let i=0;i<28;i++){let s=document.createElement('span');s.textContent=['💜','✨','🎮','🎁','🔥'][i%5];s.style.position='fixed';s.style.left=Math.random()*100+'vw';s.style.top='-30px';s.style.fontSize=(18+Math.random()*20)+'px';s.style.transition='transform 2.5s linear, opacity 2.5s';document.body.appendChild(s);setTimeout(()=>{s.style.transform=`translateY(${110+Math.random()*20}vh) rotate(${Math.random()*500}deg)`;s.style.opacity=0},30);setTimeout(()=>s.remove(),2700);}}
</script>
